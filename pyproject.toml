[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-analyst"
version = "0.1.0"
description = "Local research workspace for MOEX issuers, bonds and equities in Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "mcp>=1.12,<2",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["PyYAML>=6,<7"]

[project.scripts]
moex-analyst = "moex_analyst.cli:main"
moex-analyst-mcp = "moex_analyst.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
